[package]
name = "ocl-oracle"
version = "0.1.0"
edition = "2021"
publish = false

# Crypto oracle: produces test vectors with the exact crates upstream onchainos uses,
# so the zero-dependency JS implementations can be checked byte-for-byte.
[dependencies]
serde_json = "1"
base64 = "0.22"
aes-gcm = "0.10"
scrypt = "0.11"
rand = "0.8"
k256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = "2"
tiny-keccak = { version = "2", features = ["keccak"] }
bs58 = "0.5"
alloy-sol-types = "1"
alloy-signer = "1"
alloy-signer-local = "1"
alloy-primitives = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hpke = "0.12"
hex = "0.4"

[workspace]
